<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Ultimate Joke Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS VARIABLES & RESET */
        :root {
            --bg-color: #f4f7f6;
            --text-primary: #222222; /* Fixed contrast */
            --card-bg: #ffffff;
            --shadow: 0 8px 24px rgba(0,0,0,0.08);
            --border-color: #e0e6ed;
            --accent: #6a4efc;
            --accent-hover: #5238d6;
            --header-bg: linear-gradient(135deg, #6a4efc 0%, #a855f7 100%);
            --badge-bg: rgba(255,255,255,0.2);
            --footer-text: #7f8c8d;
            --toast-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-primary: #eeeeee; /* Bright text for dark mode */
            --card-bg: #1e1e24;
            --shadow: 0 8px 24px rgba(0,0,0,0.5);
            --border-color: #333344;
            --accent: #a855f7;
            --accent-hover: #6a4efc;
            --header-bg: linear-gradient(135deg, #1e1e24 0%, #2d1b4e 100%);
            --footer-text: #a0a0b0;
            --toast-bg: #2a2a30;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-color); color: var(--text-primary); overflow-x: hidden; transition: background 0.3s, color 0.3s; }
        a { text-decoration: none; color: inherit; }

        /* LOADING */
        .loading { position: fixed; inset: 0; background: var(--bg-color); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.6s ease; }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .loading-icon svg { width: 80px; height: 80px; }
        .loading-circle { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 283; stroke-dashoffset: 283; animation: loadSpin 1.5s ease-in-out infinite; }
        .loading-smile { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: loadSmile 1.5s ease-in-out infinite; }
        @keyframes loadSpin { 0% { stroke-dashoffset: 283; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -283; } }
        @keyframes loadSmile { 0%, 100% { stroke-dashoffset: 50; } 50% { stroke-dashoffset: 0; } }
        .loading-text { font-size: 1.2rem; margin-top: 15px; font-weight: 600; text-align: center; color: var(--accent); }
        .loading-dots { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
        .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; animation: dotBounce 1.4s ease-in-out infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); max-width: 500px; width: 100%; padding: 30px; border-radius: 20px; box-shadow: var(--shadow); text-align: center; position: relative; transform: scale(0.9); transition: transform 0.3s ease; border: 1px solid var(--border-color); }
        .modal.active .modal-content { transform: scale(1); }
        .modal-close { position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--text-primary); font-size: 1.2rem; cursor: pointer; opacity: 0.6; }
        .modal-close:hover { opacity: 1; }
        .modal-title { font-size: 1.5rem; margin-bottom: 15px; color: var(--accent); }
        .modal-text { font-size: 0.95rem; margin-bottom: 20px; line-height: 1.6; color: var(--text-primary); }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 10px 25px; border-radius: 50px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .btn-secondary { background: var(--border-color); color: var(--text-primary); }
        .btn-secondary:hover { background: #b0b8c4; }

        /* JOKE MODAL */
        .joke-modal .modal-content { max-width: 600px; }
        .joke-category-badge { display: inline-block; background: var(--accent); color: white; padding: 4px 14px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-bottom: 15px; }
        .joke-modal-text { font-size: 1.2rem; line-height: 1.6; margin-bottom: 20px; font-weight: 500; color: var(--text-primary); }
        .joke-modal-reactions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .reaction-btn, .share-btn { background: var(--border-color); border: none; padding: 8px 15px; border-radius: 50px; cursor: pointer; color: var(--text-primary); font-weight: 500; font-size: 0.9rem; transition: 0.2s; }
        .reaction-btn:hover, .share-btn:hover { background: var(--accent); color: white; transform: scale(1.05); }
        .joke-modal-navigation { display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .nav-btn { background: transparent; border: none; color: var(--text-primary); opacity: 0.7; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .nav-btn:hover { opacity: 1; color: var(--accent); }

        /* MAIN LAYOUT */
        .joke-collection { max-width: 1200px; margin: 0 auto; padding: 0 15px 60px; }

        /* HEADER */
        .joke-header { position: relative; text-align: center; padding: 40px 20px; margin-bottom: 20px; border-radius: 24px; background: var(--header-bg); color: white; overflow: hidden; }
        .joke-header-content { position: relative; z-index: 2; }
        .joke-title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 700; margin-bottom: 5px; letter-spacing: 1px; text-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .joke-count { opacity: 0.9; font-weight: 300; margin-bottom: 20px; }
        .theme-toggle { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); border: none; padding: 8px 16px; border-radius: 50px; color: white; cursor: pointer; z-index: 2; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .theme-toggle:hover { background: rgba(255,255,255,0.4); }

        /* LANGUAGE SELECTOR */
        .language-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .language-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); padding: 6px 15px; border-radius: 50px; color: white; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; transition: 0.2s; }
        .language-btn img { width: 20px; height: 14px; border-radius: 2px; }
        .language-btn.active, .language-btn:hover { background: white; color: var(--accent); border-color: white; transform: scale(1.05); }

        /* SEARCH */
        .search-container { max-width: 500px; margin: 0 auto; }
        .search-wrapper { position: relative; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border-radius: 50px; padding: 4px 15px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.3); }
        .search-icon { color: rgba(255,255,255,0.8); padding-right: 10px; }
        .search-input { background: transparent; border: none; padding: 12px 0; width: 100%; color: white; font-size: 1rem; outline: none; }
        .search-input::placeholder { color: rgba(255,255,255,0.7); }
        .search-clear { background: transparent; border: none; color: rgba(255,255,255,0.6); cursor: pointer; display: none; padding-left: 10px; }
        .search-clear.visible { display: block; }

        /* CATEGORIES */
        .categories-container { position: relative; display: flex; align-items: center; margin-bottom: 30px; gap: 10px; }
        .categories { display: flex; gap: 12px; overflow-x: auto; scroll-behavior: smooth; padding-bottom: 10px; flex: 1; -ms-overflow-style: none; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .category-btn { background: var(--card-bg); border: 1px solid var(--border-color); padding: 8px 20px; border-radius: 50px; color: var(--text-primary); cursor: pointer; white-space: nowrap; font-weight: 500; transition: 0.2s; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }
        .category-btn i { font-size: 0.9rem; }
        .category-btn:hover { background: var(--accent); color: white; border-color: var(--accent); transform: translateY(-2px); }
        .category-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .scroll-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); color: var(--text-primary); transition: 0.2s; flex-shrink: 0; }
        .scroll-btn:hover { background: var(--accent); color: white; }

        /* CONTENT & PAGINATION */
        .content-wrapper { position: relative; }
        .jokes-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; min-height: 300px; }
        .no-results { display: none; grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-primary); opacity: 0.7; }
        .no-results.visible { display: block; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 40px; flex-wrap: wrap; }
        .page-btn { background: var(--card-bg); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.2s; color: var(--text-primary); }
        .page-btn:hover, .page-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .page-btn.disabled { opacity: 0.5; pointer-events: none; }

        /* JOKE CARDS */
        .joke-card { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); cursor: pointer; position: relative; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
        .joke-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); border-color: var(--accent); }
        .joke-badge { position: absolute; top: -8px; right: 15px; background: var(--accent); color: white; font-size: 0.6rem; font-weight: 600; padding: 2px 12px; border-radius: 50px; text-transform: uppercase; }
        .joke-text { flex: 1; font-size: 0.95rem; line-height: 1.6; margin-bottom: 15px; color: var(--text-primary); }
        .joke-card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-primary); opacity: 0.7; border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: auto; }

        /* TOAST */
        .toast-notification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--toast-bg); box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 12px 25px; border-radius: 50px; display: flex; align-items: center; gap: 12px; opacity: 0; transition: 0.4s; z-index: 2000; border: 1px solid var(--border-color); color: var(--text-primary); }
        .toast-notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-notification i { color: #10b981; font-size: 1.2rem; }
        .toast-notification span { font-weight: 500; }

        /* RESPONSIVE TWEAKS */
        @media (max-width: 768px) {
            .joke-header { padding: 30px 15px; }
            .theme-toggle { top: 10px; right: 10px; padding: 6px 12px; font-size: 0.8rem; }
            .jokes-container { grid-template-columns: 1fr; gap: 15px; }
            .scroll-btn { display: none; }
            .categories { gap: 8px; padding: 0 15px; }
            .category-btn { font-size: 0.8rem; padding: 6px 14px; }
            .language-btn { font-size: 0.8rem; padding: 4px 10px; }
            .modal-content { padding: 20px; width: 95%; }
            .joke-modal-text { font-size: 1rem; }
        }
        @media (max-width: 480px) {
            .joke-title { font-size: 1.8rem; }
            .jokes-container { grid-template-columns: 1fr; }
            .pagination { gap: 4px; }
            .page-btn { padding: 6px 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loadingScreen">

        <div class="categories-container">

            <button class="scroll-btn scroll-right" id="scrollRight"><i class="fas fa-chevron-right"></i></button>

            // Bangla (BN) - 100+ Jokes
            bn: [
                { id: 'b1', cat: 'general', text: "কেন বিজ্ঞানীরা পরমাণুকে বিশ্বাস করেন না? কারণ তারা সবকিছু বানিয়ে ফেলে।" },
                { id: 'b3', cat: 'general', text: "কাকতাড়ুয়া পুরস্কার পেল কেন? কারণ সে তার মাঠে অসাধারণ ছিল।" },
                { id: 'b4', cat: 'general', text: "আমি আমার স্ত্রীকে বললাম তার ভুলগুলোকে আলিঙ্গন করা উচিত। সে আমাকে জড়িয়ে ধরল।" },
                { id: 'b5', cat: 'general', text: "কমলার মতো দেখতে আর টিয়ার মতো শব্দ করে কী? একটা গাজর।" },
                { id: 'b6', cat: 'general', text: "পবিত্র জল কীভাবে বানাবেন? আপনি এর থেকে জাহান্নাম বের করে দিয়ে ফুটিয়ে নিন।" },
                { id: 'b7', cat: 'general', text: "ডিমরা কেন মজার কথা বলে না? কারণ তারা একে অপরকে ফাটিয়ে দেবে।" },
                { id: 'b8', cat: 'general', text: "দাঁতবিহীন ভাল্লুককে কী বলে? গামি বিয়ার।" },
                { id: 'b9', cat: 'general', text: "সাইকেলটা কেন পড়ে গেল? কারণ এটি দু'টায়ার্ড ছিল (টায়ার্ড অর্থ ক্লান্ত)।" },
                { id: 'b10', cat: 'general', text: "সুইজারল্যান্ডের সবচেয়ে ভালো জিনিস কী? জানি না, তবে পতাকাটা একটা বড় প্লাস (চিহ্ন)।" },
                { id: 'b11', cat: 'general', text: "আমি অ্যান্টি-গ্রাভিটি বই পড়ছি। এটা নামিয়ে রাখা অসম্ভব।" },
                { id: 'b12', cat: 'general', text: "নকল নুডলকে কী বলে? ইম্পাসতা।" },
                { id: 'b13', cat: 'general', text: "গণিতের বইটি এত দুঃখী দেখাচ্ছিল কেন? কারণ এর অনেক সমস্যা ছিল।" },
                { id: 'b14', cat: 'general', text: "লাইফসেভার আবিষ্কারকের কথা শুনেছেন? তারা বলে তিনি মিন্ট (টাকা) তৈরি করেছিলেন।" },
                { id: 'b15', cat: 'general', text: "হিপ্পো আর জিপ্পোর মধ্যে পার্থক্য কী? একটা খুব ভারী, আরেকটা একটু হালকা।" },
                { id: 'b16', cat: 'general', text: "আমি লিফটকে ভয় পাই। আমি এগুলো এড়ানোর জন্য সিঁড়ি ব্যবহার করতে শুরু করছি।" },
                { id: 'b17', cat: 'general', text: "বাদামী আর আঠালো কী? লাঠি।" },
                { id: 'b18', cat: 'general', text: "সবুজ আর চাকা আছে কী? ঘাস। আমি চাকার বিষয়ে মিথ্যা বলেছি।" },
                { id: 'b19', cat: 'general', text: "আমি সামুদ্রিক খাবারের ডায়েটে আছি। আমি খাবার দেখলেই খাই।" },
                { id: 'b20', cat: 'general', text: "চাঁদ কীভাবে তার চুল কাটে? এটিকে গ্রহণ করে।" },
                { id: 'b21', cat: 'general', text: "কঙ্কালরা একে অপরের সাথে লড়াই করে না কেন? তাদের সাহস (গাট) নেই।" },
                { id: 'b22', cat: 'general', text: "আমি কানের সাহায্যে পিয়ানো বাজাতাম। এখন আমি শুধু আঙ্গুল ব্যবহার করি।" },
                { id: 'b23', cat: 'general', text: "রাবার আঙুলওয়ালা লোককে কী বলে? রবার্তো।" },
                { id: 'b24', cat: 'general', text: "সমুদ্র সৈকতকে কী বলল? কিছুই না, শুধু হাত নাড়ল।" },
                { id: 'b25', cat: 'general', text: "আমি সিঁড়ির খুব একটা পছন্দ করি না। তারা সবসময় কিছু না কিছু করছে।" },
                { id: 'b26', cat: 'general', text: "স্নোম্যান আর ভ্যাম্পায়ারকে ক্রস করলে কী পাওয়া যায়? ফ্রস্টবাইট।" },
                { id: 'b27', cat: 'general', text: "পেটারোড্যাক্টিল টয়লেটে যাওয়ার শব্দ কেন শোনা যায় না? কারণ পি অক্ষরটি নীরব।" },
                { id: 'b28', cat: 'general', text: "আমি একটি নতুন শব্দ আবিষ্কার করেছি: চুরি।" },
                { id: 'b29', cat: 'general', text: "দৈত্যাকার শামুক কোথায় পাওয়া যায়? দৈত্যাকার কুকুরের পাঁজরের শেষে।" },
                { id: 'b30', cat: 'general', text: "গলফ খেলোয়াড় কেন তার কাপড় বদলালো? সে এক শটে গর্ত করেছিল।" },
                { id: 'b31', cat: 'general', text: "ড্যাড জোক: তোমার কি কুকুর আছে? 'হ্যাঁ, তার নাম নাচে।' 'সে কি ভালো নাচে?' 'আমি জানি না, আমি তাকে নাচতে দেখিনি।'" },
                { id: 'b32', cat: 'dad', text: "বাবার রসিকতা: কেন ফোনের ব্যাটারি দ্রুত শেষ হয়ে যায়? কারণ এর জীবন 'চার্জিং'।" },
                { id: 'b33', cat: 'programming', text: "কেন প্রোগ্রামাররা ডার্ক মোড পছন্দ করে? কারণ আলো পোকামাকড় (বাগ) আকর্ষণ করে।" },
                { id: 'b34', cat: 'programming', text: "প্রোগ্রামারের প্রিয় জায়গা কোনটি? ফু বার।" },
                { id: 'b35', cat: 'programming', text: "একটি বাল্ব বদলাতে কতজন প্রোগ্রামার লাগে? কেউ না। এটা হার্ডওয়্যার সমস্যা।" },
                { id: 'b36', cat: 'animal', text: "হাতিরা কম্পিউটার ব্যবহার করে না কেন? তারা মাউসকে ভয় পায়।" },
                { id: 'b37', cat: 'animal', text: "বিড়াল ইঁদুরকে কী বলল? 'তোমাকে সুস্বাদু দেখাচ্ছে।'" },
                { id: 'b38', cat: 'animal', text: "কুকুর ছায়ায় বসেছিল কেন? কারণ সে হট ডগ হতে চায়নি।" },
                { id: 'b39', cat: 'kids', text: "স্কুলে ছাত্র কেন তার বাড়ির কাজ খেয়ে ফেলল? শিক্ষক বলেছিলেন এটা 'কেকের টুকরো' (সহজ কাজ)।" },
                { id: 'b40', cat: 'kids', text: "শিক্ষক কেন সানগ্লাস পরে ছিলেন? তার ছাত্ররা এত উজ্জ্বল ছিল।" },
                { id: 'b41', cat: 'adult', text: "পুরুষরা কেন চোখের যোগাযোগ করতে কষ্ট পায়? কারণ স্তনের চোখ নেই।" },
                { id: 'b42', cat: 'adult', text: "জি-স্পট আর গলফ বলের মধ্যে পার্থক্য কী? একজন লোক গলফ বল খুঁজতে আসলে ২০ মিনিট ব্যয় করবে।" },
                { id: 'b43', cat: 'dark', text: "মৃত্যু নিয়ে আমার একটি কৌতুক আছে, কিন্তু এটি কিছুটা অশুভ।" },
                { id: 'b44', cat: 'dark', text: "আমি টাইটানিক সম্পর্কে একটি বই পড়ছি। এটা সত্যিই পৃষ্ঠা-উল্টানো (আকর্ষণীয়)।" },
                { id: 'b45', cat: 'food', text: "টমেটো কেন লাল হয়ে গেল? কারণ এটি সালাদ ড্রেসিং দেখে ফেলেছিল!" },
                { id: 'b46', cat: 'food', text: "দুঃখী স্ট্রবেরিকে কী বলে? ব্লুবেরি।" },
                { id: 'b47', cat: 'food', text: "কুকি কেন ডাক্তারের কাছে গেল? এটি ভঙ্গুর বোধ করছিল।" },
                { id: 'b48', cat: 'romantic', text: "আমি তোমাকে পিজ্জার চেয়েও বেশি ভালোবাসি। আর আমি পিজ্জা সত্যিই ভালোবাসি।" },
                { id: 'b49', cat: 'romantic', text: "তুমি আমার ম্যাকারনির পনির।" },
                { id: 'b50', cat: 'school', text: "ছাত্র তার বাড়ির কাজ খেয়ে ফেলল কেন? তার শিক্ষক বলেছিলেন এটা 'কেকের টুকরো'।" },
                { id: 'b51', cat: 'school', text: "শিক্ষক কেন রোদচশমা পরেছিলেন? কারণ তার ছাত্ররা এত উজ্জ্বল ছিল।" },
                { id: 'b52', cat: 'work', text: "কর্মী কেন পদোন্নতি পেল? সে জানত কীভাবে কফি মেশিন ব্যবহার করতে হয়।" },
                { id: 'b53', cat: 'work', text: "এক মিটিং যা কখনো শেষ হয় না তাকে কী বলে? সোমবার।" },
                { id: 'b54', cat: 'general', text: "কেন গরুরা ঘণ্টা পরে? কারণ তাদের শিং কাজ করে না।" },
                { id: 'b55', cat: 'general', text: "গান গাওয়া গরুকে কী বলে? মু-সিশিয়ান।" },
                { id: 'b56', cat: 'general', text: "দুধ দেয় না এমন গরুকে কী বলে? একটি ওডার ফেইলিউর।" },
                { id: 'b57', cat: 'general', text: "গরু রাস্তা পার হলো কেন? অপর প্রান্তে যাওয়ার জন্য।" },
                { id: 'b58', cat: 'general', text: "ষাঁড় তার স্ত্রীকে কী বলল? 'আমি একটু শিং-ওয়ালা (হর্নি) বোধ করছি।'" },
                { id: 'b59', cat: 'general', text: "ষাঁড় মাতাডোরের দিকে ছুটে গেল কেন? কারণ সে একটু ষাঁড়-মাথাওয়ালা ছিল।" },
                { id: 'b60', cat: 'general', text: "ঘুমন্ত ষাঁড়কে কী বলে? বুল-ডোজার।" },
                { id: 'b61', cat: 'general', text: "ষাঁড় ও গাড়ি ক্রস করলে কী পাওয়া যায়? বুল-লেট।" },
                { id: 'b62', cat: 'general', text: "ষাঁড়রা কেন মারামারি করে? কারণ একে অপরের সাথে তাদের গরুর মাংস (বিফ) আছে।" },
                { id: 'b63', cat: 'general', text: "খাওয়া বন্ধ না করা গরুকে কী বলে? পাসচার-আইজার।" },
                { id: 'b64', cat: 'dad', text: "বাবার রসিকতা: কেন কুমির তার স্কুলের বন্ধুর সাথে কথা বলতে চায় না? কারণ তার মুখ বড়।" },
                { id: 'b65', cat: 'dad', text: "বাবার রসিকতা: ছেলে গরুর দুধ নিয়ে স্কুলে গেল। শিক্ষক জিজ্ঞেস করলেন, 'এটা কী?' ছেলে বলল, 'গরুর দুধ'। শিক্ষক বললেন, 'কিন্তু এটা তো মিষ্টি!' ছেলে বলল, 'হ্যাঁ, গরুর পছন্দ!'" },
                { id: 'b66', cat: 'programming', text: "কেন প্রোগ্রামাররা প্রকৃতি ঘৃণা করে? এতে খুব বেশি বাগ আছে।" },
                { id: 'b67', cat: 'programming', text: "কেন জাভাস্ক্রিপ্ট ডেভেলপার দুঃখী ছিল? সে তার অনুভূতিগুলোকে 'নাল' করতে জানত না।" },
                { id: 'b68', cat: 'programming', text: "প্রোগ্রামারদের প্রিয় সিনেমা কোনটি? দ্য ম্যাট্রিক্স।" },
                { id: 'b69', cat: 'animal', text: "সাপ এবং ইঁদুর ক্রস করলে কী পাওয়া যায়? একটি মাউস ট্র্যাপ।" },
                { id: 'b70', cat: 'animal', text: "বিড়ালরা কেন তাস খেলা পছন্দ করে না? কারণ তারা ডেক (ডেক - ডেক/তাসের গোছা) ঘৃণা করে।" },
                { id: 'b71', cat: 'animal', text: "ঘুমন্ত ষাঁড়কে কী বলে? বুল-ডোজার (একটি ব্র্যান্ড)।" },
                { id: 'b72', cat: 'kids', text: "গণিতের বই ও জীববিজ্ঞানের বই একে অপরকে কী বলল? 'আমাদের অনেক সমস্যা আছে।'" },
                { id: 'b73', cat: 'kids', text: "ছাত্র স্কুলে মই নিয়ে গেল কেন? সে উচ্চ বিদ্যালয়ে যেতে চেয়েছিল।" },
                { id: 'b74', cat: 'adult', text: "কেন পুরুষরা পর্ণ দেখতে পছন্দ করে? এটাই একমাত্র সময় যখন তারা একজন মহিলাকে দেখতে পায় যে তাদের মুখের দিকে তাকিয়ে থাকা বন্ধ করতে পারে না।" },
                { id: 'b75', cat: 'dark', text: "আমি নিজের মৃত্যুকে ভয় পাই না। আমি শুধু সেখানে থাকতে চাই না যখন তা ঘটবে।" },
                { id: 'b76', cat: 'dark', text: "আমি আমার স্ত্রীকে বললাম তার ভুলগুলোকে আলিঙ্গন করা উচিত। সে আমাকে জড়িয়ে ধরল।" },
                { id: 'b77', cat: 'dark', text: "আমি কানের সাহায্যে পিয়ানো বাজাতাম। এখন আমি শুধু আঙ্গুল ব্যবহার করি।" },
                { id: 'b78', cat: 'food', text: "পাই-এর চেয়ে টার্কির প্রিয় ডেজার্ট কী? পিচ গবলার।" },
                { id: 'b79', cat: 'food', text: "চকলেটে ঢাকা ভেড়াকে কী বলে? ক্যান্ডি বার।" },
                { id: 'b80', cat: 'food', text: "আপনি লালিত গরু থেকে কী পান? নষ্ট দুধ।" },
                { id: 'b81', cat: 'romantic', text: "আমি তোমাকে কফি ছেড়ে দিতে পারি। এটা সিরিয়াস কথা।" },
                { id: 'b82', cat: 'romantic', text: "তুমিই কারণ আমি বিছানা থেকে উঠি। আমার মূত্রাশয় ছাড়া।" },
                { id: 'b83', cat: 'school', text: "শিক্ষক ক্যালেন্ডারের প্রতি রাগ করলেন কেন? কারণ এটি দিনগুলো খুব ছোট করে দিচ্ছিল।" },
                { id: 'b84', cat: 'school', text: "একটি স্কুল যা সবসময় খোলা থাকে তাকে কী বলে? একটি 24-ঘন্টা একাডেমি।" },
                { id: 'b85', cat: 'work', text: "বসের প্রিয় শব্দ কী? 'হ্যাঁ'।" },
                { id: 'b86', cat: 'work', text: "কর্মচারী কেন নতুন কম্পিউটার পেল? তার পুরানোটি খুব ধীর ছিল।" },
                { id: 'b87', cat: 'general', text: "কাকতাড়ুয়া পুরস্কার পেল কেন? কারণ সে তার মাঠে অসাধারণ ছিল। (হোমোফোন - আউটস্ট্যান্ডিং / ফিল্ড)" },
                { id: 'b88', cat: 'general', text: "আমি সিঁড়ি পছন্দ করি না। তারা সবসময় কিছু না কিছু করছে (আপ টু সামথিং)।" },
                { id: 'b89', cat: 'dad', text: "বাবার রসিকতা: আমি আমার ছেলেকে বললাম, 'তোমার চোখে ঘুম নেই।' সে বলল, 'আমার চোখে ঘুম থাকে না বাবা, আমার চোখে শুধু আত্মা আছে।'" },
                { id: 'b90', cat: 'dad', text: "বাবার রসিকতা: কেন চশমা বৃষ্টিতে ভিজে? কারণ তারা লেন্স-এ (লেন্স/ল্যান্স) স্নান করে।" },
                { id: 'b91', cat: 'programming', text: "প্রোগ্রামারদের প্রিয় খেলা কি? কোড-ব্রেকার।" },
                { id: 'b92', cat: 'programming', text: "আপনি একজন প্রোগ্রামারকে কিভাবে কিছু করতে দিবেন? তাদের বলুন এটা করা যাবে না।" },
                { id: 'b93', cat: 'animal', text: "একটি খরগোশ যে লড়াই করেছে তাকে কী বলে? হেয়ার-লিপ।" },
                { id: 'b94', cat: 'animal', text: "কাঁপানো গরুকে কী বলে? বীফ জার্কি।" },
                { id: 'b95', cat: 'kids', text: "গণিত বই ও জীববিজ্ঞান বই একে অপরকে কী বলল? 'আমাদের অনেক সমস্যা আছে।'" },
                { id: 'b96', cat: 'kids', text: "ছাত্রকে কেন আটক করা হলো? সে শিক্ষকের দিকে রাবার ব্যান্ড ছুঁড়েছিল।" },
                { id: 'b97', cat: 'adult', text: "নারী কেন পুরুষদের চেয়ে বেশি দিন বাঁচে? কারণ তাদের ব্যথা মোকাবেলার বেশি অভিজ্ঞতা আছে।" },
                { id: 'b98', cat: 'adult', text: "একজন পুরুষ যিনি সর্বদা সঠিক তাকে কী বলে? একজন ব্যাচেলর।" },
                { id: 'b99', cat: 'dark', text: "কেন আপনি কখনো গাছে হাতি লুকিয়ে থাকতে দেখেন না? কারণ তারা এটাতে খুব ভালো।" },

                { id: 'ar104', cat: 'general', text: "ماذا قال الذرة عندما سُئل؟ 'أنا محتار.'" },
                { id: 'ar105', cat: 'dad', text: "نكتة أبي: لماذا نأكل البيض؟ لأنه مصدر صحي للبروتين!" }

        // ============================================================
        // 2. APP STATE & DOM REFS
        // ============================================================
        let currentLang = 'en';
        let currentCategory = 'all';
        let currentPage = 1;
        let searchTerm = '';
        const ITEMS_PER_PAGE = 24;
        let currentJokeIndex = -1;
        let currentJokesList = [];
        let pendingAdultAction = null; // Store action to execute after age verification

        const dom = {
            loader: document.getElementById('loadingScreen'),
            ageModal: document.getElementById('ageVerificationModal'),
            adultModalText: document.getElementById('adultModalText'),
            jokeModal: document.getElementById('jokeModal'),
            closeJokeModal: document.getElementById('closeJokeModal'),
            categoryContainer: document.getElementById('categoriesContainer'),
            jokesContainer: document.getElementById('jokesContainer'),
            noResults: document.getElementById('noResults'),
            pagination: document.getElementById('pagination'),
            searchInput: document.getElementById('searchInput'),
            searchClear: document.getElementById('searchClear'),
            themeToggle: document.getElementById('themeToggle'),
            jokeCount: document.getElementById('jokeCount'),
            jokeModalText: document.getElementById('jokeModalText'),
            jokeModalCategory: document.getElementById('jokeModalCategory'),
            prevJoke: document.getElementById('prevJoke'),
            nextJoke: document.getElementById('nextJoke'),
            langBtns: document.querySelectorAll('.language-btn'),
            categoryBtns: document.querySelectorAll('.category-btn'),
            toast: document.getElementById('toastNotification'),
            toastMsg: document.getElementById('toastMessage'),
            scrollLeft: document.getElementById('scrollLeft'),
            scrollRight: document.getElementById('scrollRight'),
        };

        // ============================================================
        // 3. UTILITY FUNCTIONS
        // ============================================================
        function getCurrentJokes() {
            return JOKES_DATA[currentLang] || JOKES_DATA['en'];
        }

        function filterJokes() {
            let jokes = getCurrentJokes();
            let term = searchTerm.toLowerCase().trim();
            if (currentCategory !== 'all') {
                jokes = jokes.filter(j => j.cat === currentCategory);
            }
            if (term) {
                jokes = jokes.filter(j => j.text.toLowerCase().includes(term));
            }
            return jokes;
        }

        function updateJokeCount(count) {
            dom.jokeCount.textContent = count;
        }

        function renderPagination(totalItems) {
            dom.pagination.innerHTML = '';
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
            prevBtn.innerHTML = '&laquo;';
            prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderJokes(); } };
            dom.pagination.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => { currentPage = i; renderJokes(); };
                dom.pagination.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
            nextBtn.innerHTML = '&raquo;';
            nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderJokes(); } };
            dom.pagination.appendChild(nextBtn);
        }

        function showToast(msg, icon = 'fa-check-circle') {
            dom.toastMsg.textContent = msg;
            dom.toast.querySelector('i').className = `fas ${icon}`;
            dom.toast.classList.add('show');
            clearTimeout(dom.toast._timeout);
            dom.toast._timeout = setTimeout(() => dom.toast.classList.remove('show'), 3000);
        }

        function openJokeModal(joke, index, list) {
            // Check Adult Verification if the joke is adult
            if (joke.cat === 'adult' && !localStorage.getItem('adultVerified')) {
                pendingAdultAction = () => openJokeModal(joke, index, list);
                dom.adultModalText.textContent = "You are trying to open an adult humor joke. Please confirm you are 18 or older.";
                dom.ageModal.classList.add('active');
                return;
            }

            currentJokeIndex = index;
            currentJokesList = list;
            dom.jokeModalCategory.textContent = joke.cat.toUpperCase();
            dom.jokeModalText.textContent = joke.text;
            dom.jokeModal.classList.add('active');
            dom.prevJoke.style.display = index > 0 ? 'inline-block' : 'none';
            dom.nextJoke.style.display = index < list.length - 1 ? 'inline-block' : 'none';
        }

        function closeJokeModal() {
            dom.jokeModal.classList.remove('active');
        }

        function checkAdultAccess(callback) {
            if (localStorage.getItem('adultVerified') === 'true') {
                callback();
                return;
            }
            pendingAdultAction = callback;
            dom.adultModalText.textContent = "This category contains adult humor. Please confirm you are 18 or older to view this content.";
            dom.ageModal.classList.add('active');
        }

        // ============================================================
        // 4. RENDER FUNCTION
        // ============================================================
        function renderJokes() {
            let filtered = filterJokes();
            updateJokeCount(filtered.length);

            if (filtered.length === 0) {
                dom.noResults.classList.add('visible');
                dom.jokesContainer.innerHTML = '';
                dom.pagination.innerHTML = '';
                return;
            }
            dom.noResults.classList.remove('visible');

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);

            dom.jokesContainer.innerHTML = '';
            pageItems.forEach((joke, idx) => {
                const card = document.createElement('div');
                card.className = 'joke-card';
                card.innerHTML = `
                    ${joke.cat !== 'general' ? `<span class="joke-badge">${joke.cat}</span>` : ''}
                    <div class="joke-text">${joke.text}</div>
                    <div class="joke-card-footer">
                        <span>${joke.cat}</span>
                        <span><i class="far fa-smile"></i></span>
                    </div>
                `;
                const globalIndex = start + idx;
                card.onclick = () => openJokeModal(joke, globalIndex, filtered);
                dom.jokesContainer.appendChild(card);
            });

            renderPagination(filtered.length);
            gsap.from('.joke-card', { opacity: 0, y: 20, duration: 0.3, stagger: 0.05, ease: 'power2.out' });
        }

        // ============================================================
        // 5. EVENT LISTENERS & INIT
        // ============================================================
        function init() {
            // Age Verification Logic (Only for Adult category/jokes)
            document.getElementById('ageVerificationYes').onclick = () => {
                localStorage.setItem('adultVerified', 'true');
                dom.ageModal.classList.remove('active');
                if (pendingAdultAction) {
                    pendingAdultAction();
                    pendingAdultAction = null;
                }
            };
            document.getElementById('ageVerificationNo').onclick = () => {
                dom.ageModal.classList.remove('active');
                pendingAdultAction = null;
                // If they clicked Adult category, reset to All
                if (currentCategory === 'adult') {
                    document.querySelector('.category-btn[data-category="all"]').click();
                }
                showToast("Dummy! go and sleep. Access to adult content denied.", "fa-times-circle");
            };

            // Joke Modal Controls
            dom.closeJokeModal.onclick = closeJokeModal;
            dom.jokeModal.onclick = (e) => { if (e.target === dom.jokeModal) closeJokeModal(); };
            dom.prevJoke.onclick = () => {
                if (currentJokeIndex > 0) openJokeModal(currentJokesList[currentJokeIndex - 1], currentJokeIndex - 1, currentJokesList);
            };
            dom.nextJoke.onclick = () => {
                if (currentJokeIndex < currentJokesList.length - 1) openJokeModal(currentJokesList[currentJokeIndex + 1], currentJokeIndex + 1, currentJokesList);
            };
            document.querySelectorAll('.reaction-btn').forEach(btn => {
                btn.onclick = () => showToast('Thanks for your feedback!', 'fa-heart');
            });
            document.querySelector('.share-btn').onclick = () => {
                if (navigator.share) navigator.share({ title: 'Funny Joke', text: currentJokesList[currentJokeIndex]?.text || 'Check this joke!' });
                else showToast('Copied to clipboard!', 'fa-copy');
            };

            // Language Toggle
            dom.langBtns.forEach(btn => {
                btn.onclick = () => {
                    dom.langBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLang = btn.dataset.lang;
                    currentPage = 1;
                    renderJokes();
                    showToast(`Switched to ${btn.querySelector('span').textContent}`);
                };
            });

            // Category Toggle
            dom.categoryBtns.forEach(btn => {
                btn.onclick = () => {
                    // Check Adult Verification for adult category
                    if (btn.dataset.category === 'adult' && !localStorage.getItem('adultVerified')) {
                        checkAdultAccess(() => {
                            dom.categoryBtns.forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            currentCategory = btn.dataset.category;
                            currentPage = 1;
                            renderJokes();
                        });
                        return;
                    }

                    dom.categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                    currentPage = 1;
                    renderJokes();
                };
            });

            // Search
            dom.searchInput.oninput = (e) => {
                searchTerm = e.target.value;
                dom.searchClear.classList.toggle('visible', searchTerm.length > 0);
                currentPage = 1;
                renderJokes();
            };
            dom.searchClear.onclick = () => {
                dom.searchInput.value = '';
                dom.searchInput.dispatchEvent(new Event('input'));
                dom.searchInput.focus();
            };

            // Theme Toggle
            dom.themeToggle.onclick = () => {
                const root = document.querySelector('.joke-collection');
                const isDark = root.dataset.theme === 'dark';
                root.dataset.theme = isDark ? 'light' : 'dark';
                dom.themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i> <span>Dark</span>' : '<i class="fas fa-sun"></i> <span>Light</span>';
            };

            // Category Scroll Buttons
            dom.scrollLeft.onclick = () => dom.categoryContainer.scrollBy({ left: -200, behavior: 'smooth' });
            dom.scrollRight.onclick = () => dom.categoryContainer.scrollBy({ left: 200, behavior: 'smooth' });

            // Initial Render & Loader
            renderJokes();
            setTimeout(() => dom.loader.classList.add('hidden'), 800);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
