<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>JokeVerse </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ─── RESET & VARIABLES ─── */
        :root {
            --bg: #0b0b12;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text: #f0f0f5;
            --text-muted: #a0a0b8;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --border: rgba(255, 255, 255, 0.08);
            --radius: 18px;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(236, 72, 153, 0.04) 0%, transparent 50%);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* ─── LOADING ─── */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loader .spinner {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid rgba(168, 85, 247, 0.15);
            border-top: 4px solid var(--accent);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loader p {
            margin-top: 20px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        /* ─── GLASS HEADER ─── */
        .glass-header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
        }
        .glass-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
        }
        .glass-header .brand i {
            color: var(--accent);
            font-size: 1.2rem;
        }
        .glass-header .brand span {
            opacity: 0.7;
            font-weight: 300;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .header-stats .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .header-stats .stat i {
            color: var(--accent);
            font-size: 0.75rem;
        }
        .theme-toggle-sm {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle-sm:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        /* ─── MAIN LAYOUT ─── */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        /* ─── JOKE GRID ─── */
        .joke-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .joke-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px 22px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, border-color 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .joke-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-glow), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .joke-card:hover::before {
            opacity: 1;
        }
        .joke-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .joke-card .cat-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 12px;
            border-radius: 50px;
            align-self: flex-start;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .joke-card .cat-badge:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .joke-card .cat-badge i {
            font-size: 0.55rem;
        }
        .joke-card .joke-text {
            font-size: 0.92rem;
            line-height: 1.7;
            color: var(--text);
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .joke-card .joke-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
            font-size: 0.65rem;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }
        .joke-card .joke-footer .emoji-row {
            display: flex;
            gap: 4px;
            font-size: 0.8rem;
        }
        .joke-card .joke-footer .id-tag {
            opacity: 0.3;
            font-size: 0.55rem;
        }

        /* ─── REFRESH AREA ─── */
        .refresh-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px 0 10px;
        }
        .refresh-btn {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            border: none;
            padding: 14px 48px;
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 30px var(--accent-glow);
        }
        .refresh-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 40px var(--accent-glow);
        }
        .refresh-btn:active {
            transform: scale(0.96);
        }
        .refresh-btn i {
            font-size: 1.1rem;
        }
        .refresh-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.5;
            letter-spacing: 0.5px;
        }

        /* ─── BOTTOM CATEGORIES ─── */
        .bottom-categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
        }
        .bottom-categories .cat-badge-lg {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-categories .cat-badge-lg:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: var(--accent);
            color: var(--text);
            transform: translateY(-2px);
        }
        .bottom-categories .cat-badge-lg.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .bottom-categories .cat-badge-lg i {
            font-size: 0.8rem;
        }
        .bottom-categories .cat-badge-lg.dirty {
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .bottom-categories .cat-badge-lg.dirty:hover,
        .bottom-categories .cat-badge-lg.dirty.active {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #fca5a5;
        }
        .bottom-categories .cat-badge-lg.dirty.active {
            background: #ef4444;
            color: #fff;
        }

        /* ─── JOKE MODAL ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #1a1a28;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            max-width: 540px;
            width: 100%;
            padding: 32px 30px;
            position: relative;
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }
        @keyframes modalPop {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-box .close-modal {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-box .close-modal:hover {
            color: var(--text);
            transform: rotate(90deg);
        }
        .modal-box .modal-cat {
            display: inline-block;
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 14px;
            border-radius: 50px;
            margin-bottom: 14px;
        }
        .modal-box .modal-joke {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 20px;
            color: var(--text);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            border-top: 1px solid var(--glass-border);
            padding-top: 18px;
        }
        .modal-box .modal-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 6px 18px;
            border-radius: 50px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .modal-box .modal-actions button:hover {
            background: rgba(168, 85, 247, 0.12);
            color: var(--text);
            border-color: var(--accent);
        }
        .modal-box .modal-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--glass-border);
        }
        .modal-box .modal-nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 10px;
        }
        .modal-box .modal-nav button:hover {
            color: var(--accent);
        }

        /* ─── AGE VERIFICATION ─── */
        .age-modal .modal-box {
            text-align: center;
            max-width: 440px;
        }
        .age-modal .modal-box .age-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .age-modal .modal-box .age-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .age-modal .modal-box .age-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .age-modal .modal-box .age-btns {
            display: flex;
            gap: 14px;
            justify-content: center;
        }
        .age-modal .modal-box .age-btns button {
            padding: 10px 32px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-size: 0.9rem;
        }
        .age-modal .modal-box .age-btns .btn-yes {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .age-modal .modal-box .age-btns .btn-yes:hover {
            transform: scale(1.04);
        }
        .age-modal .modal-box .age-btns .btn-no {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }
        .age-modal .modal-box .age-btns .btn-no:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e1e2e;
            border: 1px solid var(--glass-border);
            padding: 12px 28px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 3000;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            color: #34d399;
            font-size: 1rem;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .glass-header {
                padding: 8px 14px;
                min-height: 48px;
            }
            .glass-header .brand {
                font-size: 0.9rem;
            }
            .glass-header .brand span {
                display: none;
            }
            .header-stats .stat {
                font-size: 0.65rem;
            }
            .header-stats .stat.hide-mobile {
                display: none;
            }
            .joke-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .app-container {
                padding: 12px 12px 30px;
            }
            .refresh-btn {
                padding: 12px 32px;
                font-size: 0.85rem;
            }
            .bottom-categories .cat-badge-lg {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .modal-box {
                padding: 24px 18px;
            }
            .modal-box .modal-joke {
                font-size: 1rem;
            }
        }
        @media (max-width: 480px) {
            .glass-header .brand i {
                font-size: 1rem;
            }
            .glass-header .brand {
                font-size: 0.8rem;
                gap: 6px;
            }
            .header-stats .stat {
                font-size: 0.6rem;
            }
            .joke-card .joke-text {
                font-size: 0.85rem;
            }
            .joke-card {
                padding: 16px 16px;
            }
        }

        /* ─── SCROLLBAR ─── */
        .joke-grid {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }
    </style>
</head>
<body>

    <!-- ─── LOADER ─── -->
    <div id="loader">
        <div class="spinner"></div>
        <p>loading laughter...</p>
    </div>

    <!-- ─── AGE VERIFICATION MODAL ─── -->
    <div class="modal-overlay age-modal" id="ageModal">
        <div class="modal-box">
            <div class="age-icon">🔞</div>
            <div class="age-title">Age Verification</div>
            <div class="age-text" id="ageModalText">This joke contains adult humor. Please confirm you are 18 or older to view it.</div>
            <div class="age-btns">
                <button class="btn-no" id="ageNo">No, I'm Not</button>
                <button class="btn-yes" id="ageYes">Yes, I'm 18+</button>
            </div>
        </div>
    </div>

    <!-- ─── JOKE MODAL ─── -->
    <div class="modal-overlay" id="jokeModal">
        <div class="modal-box">
            <button class="close-modal" id="closeJokeModal"><i class="fas fa-times"></i></button>
            <div class="modal-cat" id="modalCat">Category</div>
            <div class="modal-joke" id="modalJokeText">Joke text</div>
            <div class="modal-actions">
                <button data-react="😂"><i class="far fa-laugh-squint"></i> Hilarious</button>
                <button data-react="😄"><i class="far fa-smile"></i> Funny</button>
                <button data-react="😐"><i class="far fa-meh"></i> Okay</button>
                <button id="shareJoke"><i class="fas fa-share-alt"></i> Share</button>
            </div>
            <div class="modal-nav">
                <button id="prevJoke"><i class="fas fa-chevron-left"></i> Previous</button>
                <button id="nextJoke">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Done!</span></div>

    <!-- ─── MAIN APP ─── -->
    <div class="app-container">

        <!-- GLASS HEADER -->
        <header class="glass-header">
            <div class="brand">
                <i class="fas fa-bolt"></i>
                JokeVerse
                <span>· no repeats</span>
            </div>
            <div class="header-stats">
                <span class="stat"><i class="fas fa-fire"></i> <span id="totalJokes">0</span></span>
                <span class="stat hide-mobile"><i class="fas fa-layer-group"></i> <span id="categoryCount">0</span> cats</span>
                <button class="theme-toggle-sm" id="themeToggle"><i class="fas fa-moon"></i> <span>Dark</span></button>
            </div>
        </header>

        <!-- JOKE GRID -->
        <div class="joke-grid" id="jokeGrid"></div>

        <!-- REFRESH ZONE -->
        <div class="refresh-zone">
            <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh Jokes</button>
            <div class="refresh-hint"> </div>
        </div>

        <!-- BOTTOM CATEGORIES (only category bar) -->
        <div class="bottom-categories" id="bottomCategories"></div>

    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        //  1. JOKE DATABASE — English only, all categories
        //     Merged from original + new additions (animal, school, work)
        // ═══════════════════════════════════════════════════════════════

        const JOKES = {

                { id: 'g18', text: "What's green and has wheels? Grass. I lied about the wheels." },
                { id: 'g19', text: "I'm on a seafood diet. I see food and I eat it." },
                { id: 'g20', text: "How does the moon cut his hair? Eclipse it." },
                { id: 'g21', text: "Why don't skeletons fight each other? They don't have the guts." },
                { id: 'g22', text: "I used to play piano by ear. Now I just use my fingers." },
                { id: 'g23', text: "What do you call a guy with a rubber toe? Roberto." },

        // ─── Build flat list with category tags ───
        function buildFlatJokes() {
            const all = [];
            for (const [cat, jokes] of Object.entries(JOKES)) {
                jokes.forEach(j => {
                    all.push({ ...j, cat });
                });
            }
            return all;
        }
        const FLAT_JOKES = buildFlatJokes();
        const CATEGORIES = Object.keys(JOKES);

        // ─── Helper: get random items ───
        function getRandomItems(arr, n) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, n);
        }

        // ─── Track seen jokes (session) ───
        let seenIds = new Set();

        // ─── Selection: 20 jokes, no repeats from seenIds ───
        function selectRandomJokes(count = 20) {
            const categories = ['general', 'dad', 'dark', 'food', 'kids', 'programming', 'romantic', 'animal', 'school', 'work'];
            const selected = [];

            // Try to pick one from each category, avoiding seen
            categories.forEach(cat => {
                const pool = JOKES[cat] || [];
                const available = pool.filter(j => !seenIds.has(j.id));
                if (available.length > 0) {
                    const idx = Math.floor(Math.random() * available.length);
                    const joke = available[idx];
                    selected.push({ ...joke, cat });
                    seenIds.add(joke.id);
                } else {
                    // If all seen, pick any (will reset later if needed)
                    const idx2 = Math.floor(Math.random() * pool.length);
                    const joke2 = pool[idx2];
                    selected.push({ ...joke2, cat });
                    seenIds.add(joke2.id);
                }
            });

            // Pick 1 adult
            const adultPool = JOKES.adult || [];
            const adultAvailable = adultPool.filter(j => !seenIds.has(j.id));
            if (adultAvailable.length > 0) {
                const idx = Math.floor(Math.random() * adultAvailable.length);
                const joke = adultAvailable[idx];
                selected.push({ ...joke, cat: 'adult' });
                seenIds.add(joke.id);
            } else {
                const idx2 = Math.floor(Math.random() * adultPool.length);
                const joke2 = adultPool[idx2];
                selected.push({ ...joke2, cat: 'adult' });
                seenIds.add(joke2.id);
            }

            // Fill remaining with random from all except adult, avoiding seen
            const remaining = count - selected.length;
            const allExceptAdult = FLAT_JOKES.filter(j => j.cat !== 'adult' && !seenIds.has(j.id));
            const extra = getRandomItems(allExceptAdult, remaining);
            extra.forEach(j => { seenIds.add(j.id); });
            selected.push(...extra);

            // If we still don't have enough, reset seenIds and retry
            if (selected.length < count) {
                seenIds.clear();
                return selectRandomJokes(count);
            }

            // Shuffle final set
            for (let i = selected.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [selected[i], selected[j]] = [selected[j], selected[i]];
            }

            return selected;
        }

                card.querySelector('.cat-badge').onclick = (e) => {
                    e.stopPropagation();
                    filterByCategory(joke.cat);
                };
                card.onclick = () => openJokeModal(joke, idx, jokes);
                grid.appendChild(card);
            });
            totalJokes.textContent = jokes.length;
            categoryCount.textContent = CATEGORIES.length;
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            // update bottom categories
            document.querySelectorAll('.cat-badge-lg').forEach(p => {
                p.classList.toggle('active', p.dataset.cat === cat);
            });
            // if adult, check age
            if (cat === 'adult' && !localStorage.getItem('adultVerified')) {
                checkAdultAccess(() => {
                    const filtered = FLAT_JOKES.filter(j => j.cat === cat);
                    const shuffled = getRandomItems(filtered, Math.min(20, filtered.length));
                    currentJokes = shuffled;
                    renderJokes(currentJokes);
                });
                return;
            }
            const filtered = FLAT_JOKES.filter(j => j.cat === cat);
            const shuffled = getRandomItems(filtered, Math.min(20, filtered.length));
            currentJokes = shuffled;
            renderJokes(currentJokes);
        }

        function refreshJokes() {
            const jokes = selectRandomJokes(20);
            currentJokes = jokes;
            renderJokes(jokes);
            showToast('Fresh jokes loaded! 🎉');
            refreshBtn.querySelector('i').style.animation = 'spin 0.6s ease';
            setTimeout(() => refreshBtn.querySelector('i').style.animation = '', 700);
        }

        function buildCategoryUI() {
            const catList = ['all', ...CATEGORIES];
            const emojiMap = {
                all: '🌍',
                general: '😂',
                dad: '👨',
                dark: '💀',
                food: '🍕',
                kids: '🧸',
                programming: '💻',
                romantic: '❤️',
                adult: '🔞',
                animal: '🐾',
                school: '📚',
                work: '💼'
            };
            // Only bottom categories
            bottomCategories.innerHTML = '';
            catList.forEach(cat => {
                const badge = document.createElement('button');
                badge.className = `cat-badge-lg${cat === 'all' ? ' active' : ''}${cat === 'adult' ? ' dirty' : ''}`;
                badge.dataset.cat = cat;
                const emoji = emojiMap[cat] || '📌';
                badge.innerHTML = `${emoji} ${cat.charAt(0).toUpperCase() + cat.slice(1)}`;
                badge.onclick = () => {
                    if (cat === 'adult' && !localStorage.getItem('adultVerified')) {
                        checkAdultAccess(() => {
                            document.querySelectorAll('.cat-badge-lg').forEach(b => b.classList.remove('active'));
                            badge.classList.add('active');
                            filterByCategory(cat);
                        });
                        return;
                    }
                    document.querySelectorAll('.cat-badge-lg').forEach(b => b.classList.remove('active'));
                    badge.classList.add('active');
                    filterByCategory(cat);
                };
                bottomCategories.appendChild(badge);
            });
        }

        // ─── Joke Modal ───
        function openJokeModal(joke, index, list) {
            if (joke.cat === 'adult' && !localStorage.getItem('adultVerified')) {
                pendingAdultAction = () => openJokeModal(joke, index, list);
                ageModalText.textContent = "This joke contains adult humor. Please confirm you are 18 or older to view it.";
                ageModal.classList.add('active');
                return;
            }
            currentJokeIndex = index;
            currentJokeList = list;
            modalCat.textContent = joke.cat.toUpperCase();
            modalJokeText.textContent = joke.text;
            modal.classList.add('active');
            prevJokeBtn.style.display = index > 0 ? 'inline-block' : 'none';
            nextJokeBtn.style.display = index < list.length - 1 ? 'inline-block' : 'none';
        }

        function closeJokeModalFn() {
            modal.classList.remove('active');
        }

        function navigateJoke(delta) {
            const newIdx = currentJokeIndex + delta;
            if (newIdx >= 0 && newIdx < currentJokeList.length) {
                openJokeModal(currentJokeList[newIdx], newIdx, currentJokeList);
            }
        }

        // ─── Age Verification ───
        function checkAdultAccess(callback) {
            if (localStorage.getItem('adultVerified') === 'true') {
                callback();
                return;
            }
            pendingAdultAction = callback;
            ageModalText.textContent = "This section contains adult humor. Please confirm you are 18 or older.";
            ageModal.classList.add('active');
        }

        // ─── Toast ───
        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ─── Share ───
        function shareJoke() {
            const text = currentJokeList[currentJokeIndex]?.text || 'Check out this joke!';
            if (navigator.share) {
                navigator.share({ title: 'JokeVerse', text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard! 📋')).catch(() => {});
            }
        }

        // ============================================================
        // 5. EVENT BINDING
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Loader
            setTimeout(() => document.getElementById('loader').classList.add('hidden'), 600);

            // Build category UI (only bottom)
            buildCategoryUI();

            // Initial load
            refreshJokes();

            // Refresh button
            refreshBtn.onclick = refreshJokes;

            // Modal controls
            closeModal.onclick = closeJokeModalFn;
            modal.onclick = (e) => { if (e.target === modal) closeJokeModalFn(); };
            prevJokeBtn.onclick = () => navigateJoke(-1);
            nextJokeBtn.onclick = () => navigateJoke(1);
            shareBtn.onclick = shareJoke;
            document.querySelectorAll('.modal-actions button[data-react]').forEach(btn => {
                btn.onclick = () => showToast('Thanks for reacting! 😊');
            });

            // Age verification
            ageYes.onclick = () => {
                localStorage.setItem('adultVerified', 'true');
                ageModal.classList.remove('active');
                if (pendingAdultAction) {
                    pendingAdultAction();
                    pendingAdultAction = null;
                }
                if (currentCategory === 'adult') {
                    filterByCategory('adult');
                }
                showToast('Access granted! 🔞');
            };
            ageNo.onclick = () => {
                ageModal.classList.remove('active');
                pendingAdultAction = null;
                if (currentCategory === 'adult') {
                    document.querySelector('.cat-badge-lg[data-cat="all"]')?.click();
                }
                showToast('Access denied. 😅');
            };

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeJokeModalFn();
                if (modal.classList.contains('active')) {
                    if (e.key === 'ArrowLeft') navigateJoke(-1);
                    if (e.key === 'ArrowRight') navigateJoke(1);
                }
            });

            // Theme toggle
            themeToggle.onclick = () => {
                const isDark = document.documentElement.style.getPropertyValue('--bg').trim() === '#0b0b12';
                const root = document.documentElement;
                if (isDark) {
                    root.style.setProperty('--bg', '#f4f4f9');
                    root.style.setProperty('--text', '#1a1a2e');
                    root.style.setProperty('--text-muted', '#555');
                    root.style.setProperty('--bg-card', 'rgba(0,0,0,0.03)');
                    root.style.setProperty('--glass-border', 'rgba(0,0,0,0.06)');
                    root.style.setProperty('--border', 'rgba(0,0,0,0.06)');
                    root.style.setProperty('--glass-bg', 'rgba(255,255,255,0.6)');
                    root.style.setProperty('--shadow', '0 12px 48px rgba(0,0,0,0.08)');
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i> Light';
                } else {
                    root.style.setProperty('--bg', '#0b0b12');
                    root.style.setProperty('--text', '#f0f0f5');
                    root.style.setProperty('--text-muted', '#a0a0b8');
                    root.style.setProperty('--bg-card', 'rgba(255,255,255,0.05)');
                    root.style.setProperty('--glass-border', 'rgba(255,255,255,0.06)');
                    root.style.setProperty('--border', 'rgba(255,255,255,0.06)');
                    root.style.setProperty('--glass-bg', 'rgba(255,255,255,0.04)');
                    root.style.setProperty('--shadow', '0 12px 48px rgba(0,0,0,0.5)');
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i> Dark';
                }
            };
        });

        // ─── Add spin animation ───
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
            @keyframes spin { to { transform: rotate(360deg); } }
            .joke-card .cat-badge { cursor: pointer; }
            .joke-card .cat-badge:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        `;
        document.head.appendChild(styleSheet);
    </script>

</body>
</html>
