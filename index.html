<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>JokeVerse — Random Jokes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ─── RESET & VARIABLES ─── */
        :root {
            --bg: #0b0b12;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text: #f0f0f5;
            --text-muted: #a0a0b8;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --border: rgba(255, 255, 255, 0.08);
            --radius: 18px;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(236, 72, 153, 0.04) 0%, transparent 50%);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* ─── LOADING ─── */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loader .spinner {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid rgba(168, 85, 247, 0.15);
            border-top: 4px solid var(--accent);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loader p {
            margin-top: 20px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        /* ─── GLASS HEADER ─── */
        .glass-header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
        }
        .glass-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
        }
        .glass-header .brand i {
            color: var(--accent);
            font-size: 1.2rem;
        }
        .glass-header .brand span {
            opacity: 0.7;
            font-weight: 300;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .header-stats .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .header-stats .stat i {
            color: var(--accent);
            font-size: 0.75rem;
        }
        .theme-toggle-sm {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle-sm:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        /* ─── MAIN LAYOUT ─── */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        /* ─── CATEGORY PILLS (top) ─── */
        .category-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            justify-content: center;
        }
        .category-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }
        .category-pill:hover {
            background: rgba(168, 85, 247, 0.12);
            border-color: var(--accent);
            color: var(--text);
            transform: translateY(-2px);
        }
        .category-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .category-pill i {
            font-size: 0.7rem;
        }
        .category-pill .count {
            opacity: 0.5;
            font-size: 0.6rem;
            margin-left: 2px;
        }

        /* ─── JOKE GRID ─── */
        .joke-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .joke-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px 22px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, border-color 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .joke-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-glow), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .joke-card:hover::before {
            opacity: 1;
        }
        .joke-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .joke-card .cat-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 12px;
            border-radius: 50px;
            align-self: flex-start;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .joke-card .cat-badge:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .joke-card .cat-badge i {
            font-size: 0.55rem;
        }
        .joke-card .joke-text {
            font-size: 0.92rem;
            line-height: 1.7;
            color: var(--text);
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .joke-card .joke-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
            font-size: 0.65rem;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }
        .joke-card .joke-footer .emoji-row {
            display: flex;
            gap: 4px;
            font-size: 0.8rem;
        }
        .joke-card .joke-footer .id-tag {
            opacity: 0.3;
            font-size: 0.55rem;
        }

        /* ─── REFRESH AREA ─── */
        .refresh-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px 0 10px;
        }
        .refresh-btn {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            border: none;
            padding: 14px 48px;
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 30px var(--accent-glow);
        }
        .refresh-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 40px var(--accent-glow);
        }
        .refresh-btn:active {
            transform: scale(0.96);
        }
        .refresh-btn i {
            font-size: 1.1rem;
        }
        .refresh-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.5;
            letter-spacing: 0.5px;
        }

        /* ─── BOTTOM CATEGORIES ─── */
        .bottom-categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
        }
        .bottom-categories .cat-badge-lg {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-categories .cat-badge-lg:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: var(--accent);
            color: var(--text);
            transform: translateY(-2px);
        }
        .bottom-categories .cat-badge-lg.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .bottom-categories .cat-badge-lg i {
            font-size: 0.8rem;
        }
        .bottom-categories .cat-badge-lg.dirty {
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .bottom-categories .cat-badge-lg.dirty:hover,
        .bottom-categories .cat-badge-lg.dirty.active {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #fca5a5;
        }
        .bottom-categories .cat-badge-lg.dirty.active {
            background: #ef4444;
            color: #fff;
        }

        /* ─── JOKE MODAL ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #1a1a28;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            max-width: 540px;
            width: 100%;
            padding: 32px 30px;
            position: relative;
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }
        @keyframes modalPop {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-box .close-modal {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-box .close-modal:hover {
            color: var(--text);
            transform: rotate(90deg);
        }
        .modal-box .modal-cat {
            display: inline-block;
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 14px;
            border-radius: 50px;
            margin-bottom: 14px;
        }
        .modal-box .modal-joke {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 20px;
            color: var(--text);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            border-top: 1px solid var(--glass-border);
            padding-top: 18px;
        }
        .modal-box .modal-actions button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 6px 18px;
            border-radius: 50px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .modal-box .modal-actions button:hover {
            background: rgba(168, 85, 247, 0.12);
            color: var(--text);
            border-color: var(--accent);
        }
        .modal-box .modal-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--glass-border);
        }
        .modal-box .modal-nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 10px;
        }
        .modal-box .modal-nav button:hover {
            color: var(--accent);
        }

        /* ─── AGE VERIFICATION ─── */
        .age-modal .modal-box {
            text-align: center;
            max-width: 440px;
        }
        .age-modal .modal-box .age-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .age-modal .modal-box .age-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .age-modal .modal-box .age-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .age-modal .modal-box .age-btns {
            display: flex;
            gap: 14px;
            justify-content: center;
        }
        .age-modal .modal-box .age-btns button {
            padding: 10px 32px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-size: 0.9rem;
        }
        .age-modal .modal-box .age-btns .btn-yes {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .age-modal .modal-box .age-btns .btn-yes:hover {
            transform: scale(1.04);
        }
        .age-modal .modal-box .age-btns .btn-no {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }
        .age-modal .modal-box .age-btns .btn-no:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e1e2e;
            border: 1px solid var(--glass-border);
            padding: 12px 28px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 3000;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            color: #34d399;
            font-size: 1rem;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .glass-header {
                padding: 8px 14px;
                min-height: 48px;
            }
            .glass-header .brand {
                font-size: 0.9rem;
            }
            .glass-header .brand span {
                display: none;
            }
            .header-stats .stat {
                font-size: 0.65rem;
            }
            .header-stats .stat.hide-mobile {
                display: none;
            }
            .joke-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .app-container {
                padding: 12px 12px 30px;
            }
            .category-strip {
                gap: 5px;
                margin-bottom: 16px;
            }
            .category-pill {
                font-size: 0.65rem;
                padding: 4px 12px;
            }
            .refresh-btn {
                padding: 12px 32px;
                font-size: 0.85rem;
            }
            .bottom-categories .cat-badge-lg {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .modal-box {
                padding: 24px 18px;
            }
            .modal-box .modal-joke {
                font-size: 1rem;
            }
        }
        @media (max-width: 480px) {
            .glass-header .brand i {
                font-size: 1rem;
            }
            .glass-header .brand {
                font-size: 0.8rem;
                gap: 6px;
            }
            .header-stats .stat {
                font-size: 0.6rem;
            }
            .joke-card .joke-text {
                font-size: 0.85rem;
            }
            .joke-card {
                padding: 16px 16px;
            }
        }

        /* ─── SCROLLBAR ─── */
        .joke-grid {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }
    </style>
</head>
<body>

    <!-- ─── LOADER ─── -->
    <div id="loader">
        <div class="spinner"></div>
        <p>loading laughter...</p>
    </div>

    <!-- ─── AGE VERIFICATION MODAL ─── -->
    <div class="modal-overlay age-modal" id="ageModal">
        <div class="modal-box">
            <div class="age-icon">🔞</div>
            <div class="age-title">Age Verification</div>
            <div class="age-text" id="ageModalText">This joke contains adult humor. Please confirm you are 18 or older to view it.</div>
            <div class="age-btns">
                <button class="btn-no" id="ageNo">No, I'm Not</button>
                <button class="btn-yes" id="ageYes">Yes, I'm 18+</button>
            </div>
        </div>
    </div>

    <!-- ─── JOKE MODAL ─── -->
    <div class="modal-overlay" id="jokeModal">
        <div class="modal-box">
            <button class="close-modal" id="closeJokeModal"><i class="fas fa-times"></i></button>
            <div class="modal-cat" id="modalCat">Category</div>
            <div class="modal-joke" id="modalJokeText">Joke text</div>
            <div class="modal-actions">
                <button data-react="😂"><i class="far fa-laugh-squint"></i> Hilarious</button>
                <button data-react="😄"><i class="far fa-smile"></i> Funny</button>
                <button data-react="😐"><i class="far fa-meh"></i> Okay</button>
                <button id="shareJoke"><i class="fas fa-share-alt"></i> Share</button>
            </div>
            <div class="modal-nav">
                <button id="prevJoke"><i class="fas fa-chevron-left"></i> Previous</button>
                <button id="nextJoke">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Done!</span></div>

    <!-- ─── MAIN APP ─── -->
    <div class="app-container">

        <!-- GLASS HEADER -->
        <header class="glass-header">
            <div class="brand">
                <i class="fas fa-bolt"></i>
                JokeVerse
                <span>· random laughs</span>
            </div>
            <div class="header-stats">
                <span class="stat"><i class="fas fa-fire"></i> <span id="totalJokes">0</span></span>
                <span class="stat hide-mobile"><i class="fas fa-layer-group"></i> <span id="categoryCount">0</span> cats</span>
                <button class="theme-toggle-sm" id="themeToggle"><i class="fas fa-moon"></i> <span>Dark</span></button>
            </div>
        </header>

        <!-- CATEGORY STRIP (top) -->
        <div class="category-strip" id="categoryStrip">
            <button class="category-pill active" data-cat="all"><i class="fas fa-globe"></i> All</button>
            <button class="category-pill" data-cat="general"><i class="fas fa-laugh"></i> General</button>
            <button class="category-pill" data-cat="dad"><i class="fas fa-user-tie"></i> Dad</button>
            <button class="category-pill" data-cat="dark"><i class="fas fa-skull"></i> Dark</button>
            <button class="category-pill" data-cat="food"><i class="fas fa-utensils"></i> Food</button>
            <button class="category-pill" data-cat="kids"><i class="fas fa-child"></i> Kids</button>
            <button class="category-pill" data-cat="programming"><i class="fas fa-code"></i> Programming</button>
            <button class="category-pill" data-cat="romantic"><i class="fas fa-heart"></i> Romantic</button>
            <button class="category-pill" data-cat="adult" style="border-color:rgba(239,68,68,0.2);color:#f87171;"><i class="fas fa-user-secret"></i> Adult</button>
        </div>

        <!-- JOKE GRID -->
        <div class="joke-grid" id="jokeGrid"></div>

        <!-- REFRESH ZONE -->
        <div class="refresh-zone">
            <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh Jokes</button>
            <div class="refresh-hint">↻ 20 fresh jokes · includes 1 dirty joke · categories vary</div>
        </div>

        <!-- BOTTOM CATEGORIES -->
        <div class="bottom-categories" id="bottomCategories">

        // ─── Build flat list with category tags ───
        function buildFlatJokes() {
            const all = [];
            for (const [cat, jokes] of Object.entries(JOKES)) {
                jokes.forEach(j => {
                    all.push({ ...j, cat });
                });
            }
            return all;
        }
        const FLAT_JOKES = buildFlatJokes();
        const CATEGORIES = Object.keys(JOKES);

        // ─── Helper: get random items ───
        function getRandomItems(arr, n) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, n);
        }

        // ─── Selection algorithm: 20 jokes, at least 1 from each category (except adult), 1 adult ───
        function selectRandomJokes(count = 20) {
            const categories = ['general', 'dad', 'dark', 'food', 'kids', 'programming', 'romantic'];
            const selected = [];

            // 1. Pick 1 from each category (except adult)
            categories.forEach(cat => {
                const pool = JOKES[cat] || [];
                if (pool.length > 0) {
                    const idx = Math.floor(Math.random() * pool.length);
                    selected.push({ ...pool[idx], cat });
                }
            });

            // 2. Pick 1 adult joke (dirty)
            const adultPool = JOKES.adult || [];
            if (adultPool.length > 0) {
                const idx = Math.floor(Math.random() * adultPool.length);
                selected.push({ ...adultPool[idx], cat: 'adult' });
            }

            // 3. Fill remaining with random from all categories (excluding adult to avoid over-dirty)
            const remaining = count - selected.length;
            const allExceptAdult = FLAT_JOKES.filter(j => j.cat !== 'adult');
            const extra = getRandomItems(allExceptAdult, remaining);
            selected.push(...extra);

            // 4. Shuffle the final set
            for (let i = selected.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [selected[i], selected[j]] = [selected[j], selected[i]];
            }

            return selected;
        }

        // 2. APP STATE
        // ============================================================
        let currentCategory = 'all';
        let currentJokes = [];
        let currentJokeIndex = -1;
        let currentJokeList = [];

        // 3. DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const grid = $('jokeGrid');
        const refreshBtn = $('refreshBtn');
        const totalJokes = $('totalJokes');
        const categoryCount = $('categoryCount');
        const modal = $('jokeModal');
        const modalCat = $('modalCat');

        // ============================================================
        // 4. RENDER
        // ============================================================
        function renderJokes(jokes) {
            grid.innerHTML = '';
            if (!jokes || jokes.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;">No jokes found.</p>';
                return;
            }
            jokes.forEach((joke, idx) => {
                const card = document.createElement('div');
                card.className = 'joke-card';
                const emojiMap = {
                    general: '😂',
                    dad: '👨',
                    dark: '💀',
                    food: '🍕',
                    kids: '🧸',
                    programming: '💻',
                    romantic: '❤️',
                    adult: '🔞'
                };
                const emoji = emojiMap[joke.cat] || '🤣';
                card.innerHTML = `
                    <span class="cat-badge" data-cat="${joke.cat}"><i class="fas fa-tag"></i> ${joke.cat} ${emoji}</span>
                    <div class="joke-text">${joke.text}</div>
                    <div class="joke-footer">
                        <span class="emoji-row">${emoji} ${joke.cat}</span>
                        <span class="id-tag">#${joke.id || 'j' + idx}</span>
                    </div>
                `;
                card.querySelector('.cat-badge').onclick = (e) => {
                    e.stopPropagation();
                    filterByCategory(joke.cat);
                };
                card.onclick = () => openJokeModal(joke, idx, jokes);
                grid.appendChild(card);
            });
            totalJokes.textContent = jokes.length;
            categoryCount.textContent = CATEGORIES.length;
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            // update pills
            document.querySelectorAll('.category-pill').forEach(p => {
                p.classList.toggle('active', p.dataset.cat === cat);
            });
            document.querySelectorAll('.cat-badge-lg').forEach(p => {
                p.classList.toggle('active', p.dataset.cat === cat);
            });
            // if adult, check age
            if (cat === 'adult' && !localStorage.getItem('adultVerified')) {
                checkAdultAccess(() => {
                    const filtered = FLAT_JOKES.filter(j => j.cat === cat);
                    const shuffled = getRandomItems(filtered, Math.min(20, filtered.length));
                    currentJokes = shuffled;
                    renderJokes(currentJokes);
                });
                return;
            }
            const filtered = FLAT_JOKES.filter(j => j.cat === cat);
            const shuffled = getRandomItems(filtered, Math.min(20, filtered.length));
            currentJokes = shuffled;
            renderJokes(currentJokes);
        }

        function refreshJokes() {
            const jokes = selectRandomJokes(20);
            currentJokes = jokes;
            renderJokes(jokes);
            // toast
            showToast('Fresh jokes loaded! 🎉');
            // animate refresh icon
            refreshBtn.querySelector('i').style.animation = 'spin 0.6s ease';
            setTimeout(() => refreshBtn.querySelector('i').style.animation = '', 700);
        }

        // ─── Joke Modal ───
        function openJokeModal(joke, index, list) {
            if (joke.cat === 'adult' && !localStorage.getItem('adultVerified')) {
                pendingAdultAction = () => openJokeModal(joke, index, list);
                ageModalText.textContent = "This joke contains adult humor. Please confirm you are 18 or older to view it.";
                ageModal.classList.add('active');
                return;
            }
            currentJokeIndex = index;
            currentJokeList = list;
            modalCat.textContent = `${joke.cat.toUpperCase()} 🔞`;
            modalJokeText.textContent = joke.text;
            modal.classList.add('active');
            prevJokeBtn.style.display = index > 0 ? 'inline-block' : 'none';
            nextJokeBtn.style.display = index < list.length - 1 ? 'inline-block' : 'none';
        }

        function closeJokeModalFn() {
            modal.classList.remove('active');
        }

        function navigateJoke(delta) {
            const newIdx = currentJokeIndex + delta;
            if (newIdx >= 0 && newIdx < currentJokeList.length) {
                openJokeModal(currentJokeList[newIdx], newIdx, currentJokeList);
            }
        }

        // ─── Age Verification ───
        function checkAdultAccess(callback) {
            if (localStorage.getItem('adultVerified') === 'true') {
                callback();
                return;
            }
            pendingAdultAction = callback;
            ageModalText.textContent = "This section contains adult humor. Please confirm you are 18 or older.";
            ageModal.classList.add('active');
        }

        // ─── Toast ───
        function showToast(msg) {
            toastMsg.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ─── Share ───
        function shareJoke() {
            const text = currentJokeList[currentJokeIndex]?.text || 'Check out this joke!';
            if (navigator.share) {
                navigator.share({ title: 'JokeVerse', text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard! 📋')).catch(() => {});
            }
        }
